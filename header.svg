<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Singgih Rochmad Saputro — Senior Android Engineer">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="45%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#34d399" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <style>
      .name { font: 700 62px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -1.6px; }
      .kick { font: 500 19px ui-monospace, "SF Mono", Menlo, monospace; fill: #9199a1; letter-spacing: 2.6px; }
      .role { font: 500 23px ui-monospace, "SF Mono", Menlo, monospace; fill: #34d399; }
      .dot  { fill: #22d3ee; }
    </style>
  </defs>

  <rect width="1200" height="280" fill="#07080a"/>

  <!-- two slow-drifting pools of colour, so the panel is never flat -->
  <g>
    <circle cx="180" cy="70" r="200" fill="url(#glow)">
      <animate attributeName="cx" values="180;320;180" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;150;70"   dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="210" r="180" fill="url(#glow)" opacity=".8">
      <animate attributeName="cx" values="1030;900;1030" dur="27s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- a sparse dot field, drifting upward like a habit streak row -->
  <g class="dot" opacity=".5">
    <circle cx="90"   cy="238" r="2.5"><animate attributeName="opacity" values=".15;.85;.15" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="118"  cy="238" r="2.5"><animate attributeName="opacity" values=".85;.15;.85" dur="5.3s" repeatCount="indefinite"/></circle>
    <circle cx="146"  cy="238" r="2.5"><animate attributeName="opacity" values=".15;.85;.15" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="174"  cy="238" r="2.5"><animate attributeName="opacity" values=".55;.15;.55" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="202"  cy="238" r="2.5"><animate attributeName="opacity" values=".15;.85;.15" dur="4.9s" repeatCount="indefinite"/></circle>
  </g>

  <text class="kick" x="88" y="78">JAKARTA · GOJEK · SINCE 2016</text>
  <text class="name" x="86" y="152" fill="url(#sheen)">Singgih Rochmad Saputro</text>

  <rect x="88" y="176" width="420" height="2" rx="1" fill="url(#rule)">
    <animate attributeName="width" values="0;420" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- roles cross-fade rather than type, one at a time -->
  <g class="role" transform="translate(88 224)">
    <text opacity="0">Senior Android Engineer
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0" dur="16s" repeatCount="indefinite"/>
    </text>
    <text opacity="0">Kotlin · Jetpack Compose · KMP
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0" dur="16s" repeatCount="indefinite"/>
    </text>
    <text opacity="0">Server-driven UI at 100M+ downloads
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
