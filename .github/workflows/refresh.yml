name: Refresh highlighted projects

on:
  schedule:
    - cron: '25 2 * * *' # 09:25 Asia/Jakarta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - run: python3 scripts/highlight-repos.py

      - name: Commit if anything moved
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Repository list unchanged."
            exit 0
          fi
          git config user.name  "Singgih Rochmad Saputro"
          git config user.email "singgih.rochmad@gmail.com"
          git add -A
          git commit -m "Refresh highlighted projects"
          git push
